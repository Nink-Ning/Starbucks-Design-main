<!--
  DesignKit Starter V1 reference implementation.
  status: approved reference implementation
  capability: starter.pattern.default-application-shell
  Golden: NO

  This asset defines the shell frame, the complete approved Brand Top Navigation
  subtree, and the Main Content Slot. Generation may substitute the marked
  business values, but it must not recreate this DOM or its layout relationships
  from prose.

  Icon Binding:
  - Generic UI icons come from window.arcoicon only.
  - Fixed pattern icons: NOTIFICATION=IconNotification,
    LIGHT_TO_DARK=IconMoon, DARK_TO_LIGHT=IconSun, CREATE=IconPlus,
    MORE=IconMore, DELETE=IconDelete.
  - Side menu business icons may use semantic Arco names, but every name must
    exist on window.arcoicon and pass typeof validation before render.
  - Do not use emoji, hand-drawn SVG, CSS icons, third-party icon libraries or
    invented names such as IconProductCenter.

  Top Navigation Binding:
  - The Brand Top Navigation is one approved subtree: Menu item,
    Notification/Badge, Theme Toggle, Divider and Avatar/User treatment stay
    together through composition.
  - Only business labels/data may vary. Do not add Menu item surfaces, a
    card-like Theme Toggle, or a light/dark User block.
  - BRAND_IDENTITY is the fixed package-local Starbucks logo asset. An
    initials-only Avatar uses a contrasting neutral fill against the brand
    header.
-->
<div class="dk-shell-reference" data-reference-id="starter.pattern.default-application-shell" data-reference-status="approved" data-reference-structure="complete-shell-dom" data-reference-style="assets/default-application-shell.css" data-shell-mode-default="default">
  <header class="dk-shell-reference__top sb-top-nav-demo__header" data-shell-region="top" data-reference-subtree="approved-brand-top-navigation" aria-label="应用顶部导航">
    <div class="dk-shell-reference__identity sb-top-nav-demo__system-slot" data-shell-region="identity">
      <img class="sb-top-nav-demo__logo" data-shell-slot="BRAND_IDENTITY" src="assets/starbucks-system-logo.svg" alt="Starbucks" />
      <div data-shell-slot="SYSTEM_SWITCH" aria-label="当前系统"></div>
    </div>
    <div class="dk-shell-reference__main sb-top-nav-demo__main">
      <nav class="sb-top-nav-demo__menu" data-shell-region="top-menu" data-shell-slot="CURRENT_MENU_TITLE" aria-label="当前菜单"></nav>
      <div class="sb-top-nav-demo__actions" data-shell-region="global-actions">
        <div class="sb-top-nav-demo__quick-actions">
          <span data-shell-slot="NOTIFICATION"></span>
          <span data-shell-slot="THEME_TOGGLE"></span>
        </div>
        <span class="sb-top-nav-demo__divider" data-shell-slot="DIVIDER" aria-hidden="true"></span>
        <div class="sb-top-nav-demo__user-area" data-shell-slot="USER_ACCESS"></div>
      </div>
    </div>
  </header>
  <div class="dk-shell-reference__body">
    <aside class="dk-shell-reference__side" data-shell-region="side" aria-label="侧边导航"></aside>
    <main class="dk-shell-reference__main" data-shell-region="main">
      <div data-shell-main-slot="approved-template" data-shell-slot-role="complete-template-subtree"></div>
    </main>
  </div>
</div>
