<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Drawer Form Reference</title>
  <link rel="stylesheet" href="../runtime/starbucks-react.css" />
  <style>
    :root { color: #1d2129; background: #f5f6f7; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; } * { box-sizing: border-box; } body { margin: 0; min-width: 320px; background: #f5f6f7; }
    .p11-top { height: 56px; display: flex; align-items: center; padding: 0 24px; color: #fff; background: #00754a; } .p11-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; } .p11-brand img { width: 26px; height: 26px; filter: brightness(0) invert(1); }
    .p11-body { display: flex; min-height: calc(100vh - 56px); } .p11-side { width: 216px; flex: 0 0 216px; padding: 24px 16px; background: #fff; border-right: 1px solid #e5e6eb; } .p11-side p { margin: 0 8px 12px; color: #86909c; font-size: 12px; } .p11-side div { padding: 10px 12px; color: #4e5969; font-size: 14px; border-radius: 4px; } .p11-side .active { color: #00754a; background: #e8f7f0; font-weight: 600; }
    .p11-main { flex: 1; min-width: 0; padding: 24px; } .p11-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; } h1 { margin: 0; font-size: 24px; line-height: 32px; } .p11-surface { width: 100%; min-height: 280px; padding: 24px; background: #fff; border: 1px solid #e5e6eb; border-radius: 6px; } .p11-note { margin: 0 0 16px; }
    @media (max-width: 720px) { .p11-side { display: none; } .p11-main { padding: 24px; } } @media (max-width: 480px) { .p11-main { padding: 24px; } }
    [data-p11-drawer-form-body] { width: 100%; min-width: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@arco-design/web-react@2.66.15/dist/arco.min.js"></script><script src="https://unpkg.com/@arco-design/web-react-icon@2.66.15/dist/arco-icon.min.js"></script><script src="../runtime/starbucks-react.umd.js"></script><script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
  <script>window.__p11ReferenceErrors = []; ["Drawer", "Form", "Input", "Select", "Button"].forEach(function (name) { if (!window.StarbucksReact || !window.StarbucksReact[name]) window.__p11ReferenceErrors.push(name); });</script>
  <script type="text/babel">
    const { Button, Drawer, Form, Input, Select } = window.StarbucksReact;
    function App() { const [visible, setVisible] = React.useState(true); const [form] = Form.useForm(); const drawerWidth = window.innerWidth <= 600 ? "100%" : 420; return <div data-reference-executable="true" data-reference-role="next-release-authority" data-template="drawer-form" data-template-context="DRAWER-FORM" data-padding="24px" data-runtime-binding="Drawer+Form"><header className="p11-top"><span className="p11-brand"><img src="../assets/starbucks-system-logo.svg" alt="" />Starter Reference</span></header><div className="p11-body"><aside className="p11-side"><p>门店管理</p><div className="active">门店列表</div><div>门店设置</div></aside><main className="p11-main" data-shell-main-padding="24px"><header className="p11-header"><h1>门店列表</h1><Button type="primary" onClick={() => setVisible(true)}>新建门店</Button></header><div className="p11-surface"><p className="p11-note">通过抽屉快速创建门店，本页为 Starter 本地 Mock 参考。</p></div></main></div><Drawer width={drawerWidth} title="新建门店" visible={visible} onCancel={() => setVisible(false)} onOk={() => setVisible(false)} okText="保存" cancelText="取消"><Form data-p11-drawer-form-body data-drawer-body-inset="24px" form={form} layout="vertical"><Form.Item field="name" label="门店名称" required><Input placeholder="请输入门店名称" /></Form.Item><Form.Item field="city" label="所在城市" required><Select placeholder="请选择城市"><Select.Option value="上海">上海</Select.Option><Select.Option value="北京">北京</Select.Option></Select></Form.Item><Form.Item field="manager" label="负责人"><Input placeholder="请输入负责人" /></Form.Item></Form></Drawer></div>; }
    ReactDOM.createRoot(document.getElementById("root")).render(window.__p11ReferenceErrors.length ? <pre>{window.__p11ReferenceErrors.join(", ")}</pre> : <App />);
  </script>
</body>
</html>
