<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grouped Form Reference</title>
  <link rel="stylesheet" href="../runtime/starbucks-react.css" />
  <style>
    :root { color: #1d2129; background: #f5f6f7; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; } * { box-sizing: border-box; } body { margin: 0; min-width: 320px; background: #f5f6f7; }
    .p11-top { height: 56px; display: flex; align-items: center; padding: 0 24px; color: #fff; background: #00754a; } .p11-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; } .p11-brand img { width: 26px; height: 26px; filter: brightness(0) invert(1); }
    .p11-body { display: flex; min-height: calc(100vh - 56px); } .p11-side { width: 260px; flex: 0 0 260px; padding: 24px 16px; background: #fff; border-right: 1px solid #e5e6eb; } .p11-side p { margin: 0 8px 12px; color: #86909c; font-size: 12px; } .p11-side div { padding: 10px 12px; color: #4e5969; font-size: 14px; border-radius: 4px; } .p11-side .active { color: #00754a; background: #e8f7f0; font-weight: 600; }
    .p11-main { flex: 1; min-width: 0; padding: 24px; } .p11-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; } h1 { margin: 0; font-size: var(--fs-20, 20px); line-height: var(--lh-28, 28px); } .p11-help { display: inline-flex; align-items: center; color: #86909c; cursor: help; } .p11-surface { width: 100%; min-width: 0; overflow: hidden; background: #fff; border: 0; border-radius: 6px; } .p11-content { width: 100%; min-width: 0; padding: 32px; } .p11-section + .p11-section { margin-top: 28px; padding-top: 28px; border-top: 1px solid #e5e6eb; } .p11-section h2 { margin: 0 0 16px; font-size: 18px; line-height: 26px; } .p11-section p { margin: -8px 0 16px; color: #86909c; font-size: 13px; } .p11-actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 16px; }
    @media (max-width: 1023px) { .p11-side { width: 56px; flex-basis: 56px; padding: 24px 0; } .p11-side > * { display: none; } .p11-main { padding: 24px; } .p11-content { padding: 32px; } } @media (max-width: 480px) { .p11-main { padding: 24px; } .p11-content { padding: 32px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@arco-design/web-react@2.66.15/dist/arco.min.js"></script><script src="https://unpkg.com/@arco-design/web-react@2.66.15/dist/arco-icon.min.js"></script><script src="../runtime/starbucks-react.umd.js"></script><script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
  <script>window.__p11ReferenceErrors = []; ["FormGrid", "FormGridItem", "FormActions", "FormPageLayout", "Form", "Input", "Select", "Button", "Tooltip"].forEach(function (name) { if (!window.StarbucksReact || !window.StarbucksReact[name]) window.__p11ReferenceErrors.push(name); }); ["IconLeft", "IconQuestionCircle"].forEach(function (name) { if (!window.arcoicon || !window.arcoicon[name]) window.__p11ReferenceErrors.push(name); });</script>
  <script type="text/babel">
    const { Button, Form, FormActions, FormGrid, FormGridItem, FormPageLayout, Input, Select, Tooltip } = window.StarbucksReact;
    const BackIcon = window.arcoicon && window.arcoicon.IconLeft;
    const QuestionIcon = window.arcoicon && window.arcoicon.IconQuestionCircle;
    function App() { const [form] = Form.useForm(); const [backNotice, setBackNotice] = React.useState(false); return <div data-reference-executable="true" data-reference-role="next-release-authority" data-template="grouped-form" data-template-context="FULL-PAGE-FORM" data-runtime-binding="native-section+FormGrid+FormActions" data-reference-structure="shared-page-header+native-section"><header className="p11-top"><span className="p11-brand"><img src="../assets/starbucks-system-logo.svg" alt="" />Starter Reference</span></header><div className="p11-body"><aside className="p11-side"><p>门店管理</p><div>门店列表</div><div className="active">门店设置</div></aside><main className="p11-main" data-shell-main-padding="24px"><header className="p11-header" data-header-level="2" data-text-back="absent" data-breadcrumb="absent"><Button type="secondary" shape="square" icon={BackIcon ? <BackIcon /> : null} aria-label="返回上一级" onClick={() => setBackNotice(true)} /><h1>门店设置</h1><Tooltip position="bottom" content="按业务分组维护门店配置"><span className="p11-help" data-template-slot="CONTEXT_HELP" data-optional="true" role="img" tabIndex={0} aria-label="页面帮助">{QuestionIcon ? <QuestionIcon /> : null}</span></Tooltip></header>{backNotice && <p className="p11-feedback" role="status">已返回门店列表（本地演示）</p>}<div className="p11-surface" data-form-surface="full-available-main" data-outer-border="absent" data-surface-radius="6px"><FormPageLayout maxWidth="none" padding={0}><div className="p11-content" data-form-content-inset="32px"><Form form={form} layout="vertical"><section className="p11-section" data-layout-composition="native-section"><h2>基础信息</h2><p>维护门店的基本识别信息。</p><FormGrid><FormGridItem><Form.Item field="name" label="门店名称" required><Input placeholder="请输入门店名称" /></Form.Item></FormGridItem><FormGridItem><Form.Item field="city" label="所在城市" required><Select placeholder="请选择城市"><Select.Option value="上海">上海</Select.Option><Select.Option value="北京">北京</Select.Option></Select></Form.Item></FormGridItem></FormGrid></section><section className="p11-section" data-layout-composition="native-section"><h2>运营信息</h2><p>补充门店负责人和联系方式。</p><FormGrid><FormGridItem><Form.Item field="manager" label="负责人"><Input placeholder="请输入负责人" /></Form.Item></FormGridItem><FormGridItem><Form.Item field="phone" label="联系电话"><Input placeholder="请输入联系电话" /></Form.Item></FormGridItem></FormGrid></section><FormActions><div className="p11-actions"><Button>取消</Button><Button type="primary">保存</Button></div></FormActions></Form></div></FormPageLayout></div></main></div></div>; }
    ReactDOM.createRoot(document.getElementById("root")).render(window.__p11ReferenceErrors.length ? <pre>{window.__p11ReferenceErrors.join(", ")}</pre> : <App />);
  </script>
</body>
</html>
