    :root {
      --dk-page-max-width: 1144px;
      --dk-page-gutter: 16px;
      --dk-page-surface: var(--bg-color-container, #ffffff);
      --dk-page-background: var(--bg-color-container, #ffffff);
      --dk-page-text: var(--color-text-1, #1a1a1a);
      --dk-page-muted: var(--color-text-2, #666666);
      --dk-page-border: var(--color-border-1, #e8e8e8);
    }

    /* Dark mode keeps the same card anatomy while restoring the approved
       page/container surface hierarchy and token-backed text contrast. */
    body[arco-theme='dark'],
    body[data-arco-theme='dark'],
    body[data-theme='dark'] {
      color-scheme: dark;
      --dk-page-background: var(--bg-color-page);
    }

    body[arco-theme='dark'] .dk-card__price,
    body[data-arco-theme='dark'] .dk-card__price,
    body[data-theme='dark'] .dk-card__price {
      color: var(--color-text-1);
    }

    body[arco-theme='dark'] .dk-card[data-selected='true'],
    body[data-arco-theme='dark'] .dk-card[data-selected='true'],
    body[data-theme='dark'] .dk-card[data-selected='true'] {
      background: var(--color-primary);
      --dk-selected-action-color: var(--color-white-text-1, rgba(255, 255, 255, 0.9));
    }

    body[arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__footer,
    body[data-arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__footer,
    body[data-theme='dark'] .dk-card[data-selected='true'] .dk-card__footer {
      background: var(--color-primary);
    }

    body[arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__sequence,
    body[arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__sequence-value,
    body[data-arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__sequence,
    body[data-arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__sequence-value,
    body[data-theme='dark'] .dk-card[data-selected='true'] .dk-card__sequence,
    body[data-theme='dark'] .dk-card[data-selected='true'] .dk-card__sequence-value {
      color: var(--color-white-text-1, rgba(255, 255, 255, 0.9));
    }

    body[arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled),
    body[data-arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled),
    body[data-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled) {
      color: var(--color-white-text-1, rgba(255, 255, 255, 0.9));
    }

    body[arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):hover,
    body[arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):focus-visible,
    body[data-arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):hover,
    body[data-arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):focus-visible,
    body[data-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):hover,
    body[data-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):focus-visible {
      color: var(--color-white-text-1, rgba(255, 255, 255, 0.9));
      background: var(--color-fill-2);
    }

    body[arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):active,
    body[data-arco-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):active,
    body[data-theme='dark'] .dk-card[data-selected='true'] .dk-card__actions .arco-btn-text:not(.arco-btn-disabled):active {
      color: var(--color-white-text-1, rgba(255, 255, 255, 0.9));
      background: var(--color-fill-3);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--dk-page-background);
      color: var(--dk-page-text);
      font-family: "Noto Sans SC", "Poppins", Roboto, sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    .dk-runtime-error {
      width: min(100% - 32px, 720px);
      margin: 48px auto;
      padding: 24px;
      border: 1px solid var(--color-danger-light-hover, #edb1b6);
      border-radius: var(--border-radius-lg, 8px);
      background: var(--color-danger-light, #fbe9ea);
      color: var(--color-danger, #c64751);
      line-height: 1.7;
    }

    .dk-runtime-error h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .dk-runtime-error p {
      margin: 0;
    }

    .dk-demo-shell {
      min-width: 0;
      padding: 0;
    }

    .dk-page {
      width: min(100%, var(--dk-page-max-width));
      min-width: 0;
      margin: 0 auto;
      font-family: var(--font-family, "Noto Sans SC", sans-serif);
    }

    .dk-page__section {
      display: grid;
      gap: var(--spacing-5, 12px);
      min-width: 0;
      padding: var(--dk-page-gutter);
      border-radius: var(--border-radius-md, 6px);
      background: var(--dk-page-surface);
    }

    .dk-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--spacing-4, 8px);
      min-width: 0;
    }

    .dk-card {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      padding: 2px 2px 0;
      border: 0;
      border-radius: 12px;
      background: var(--bg-color-secondarycontainer, #f3f3f3);
      box-shadow: none;
      transition: background-color 160ms ease, box-shadow 160ms ease;
    }

    .dk-card:hover,
    .dk-card:focus-within {
      box-shadow: 0 1px 0 rgba(24, 32, 29, 0.02);
    }

    .dk-card[data-selected="true"] {
      background: var(--color-primary, #00754a);
      --dk-selected-action-color: var(--color-white-text-1, rgba(255, 255, 255, 0.9));
    }

    .dk-card__content {
      position: relative;
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr);
      gap: var(--spacing-5, 12px);
      min-height: 100px;
      padding: var(--spacing-5, 12px) 44px var(--spacing-5, 12px) var(--spacing-6, 16px);
      border-radius: 10px 10px 12px 12px;
      background: var(--bg-color-specialcomponent, #ffffff);
    }

    .dk-card__media {
      width: 60px;
      height: 60px;
      overflow: hidden;
      border-radius: var(--border-radius-round, 999px);
      background: var(--color-primary-light, #e6f7f1);
    }

    .dk-card__media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dk-card__primary {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: var(--spacing-2, 4px);
    }

    .dk-card__heading {
      display: grid;
      gap: var(--spacing-2, 4px);
      min-width: 0;
    }

    .dk-card__title {
      margin: 0;
      overflow: hidden;
      color: var(--color-text-1, #1a1a1a);
      font-size: var(--fs-16, 16px);
      font-weight: var(--fw-regular, 400);
      line-height: var(--lh-24, 24px);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dk-card__summary,
    .dk-card__metadata,
    .dk-card__meta-pair,
    .dk-card__footer,
    .dk-card__sequence,
    .dk-card__actions {
      display: flex;
      align-items: center;
    }

    .dk-card__summary {
      gap: var(--spacing-4, 8px);
      min-width: 0;
    }

    .dk-card__price {
      flex: 0 0 auto;
      color: rgba(0, 0, 0, 0.9);
      font-family: "DK Roboto", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 20px;
      font-variant-numeric: tabular-nums;
      font-variation-settings: "wdth" 100;
      letter-spacing: 0;
    }

    .dk-card .arco-tag.dk-card__status-tag {
      height: 20px;
      padding: 0 4px;
      border: 0;
      line-height: 20px;
    }

    .dk-card .arco-tag.dk-card__status-tag--online {
      background: var(--color-success-light-hover, #c6f3d7);
      color: var(--color-primary, #00754a);
    }

    body[arco-theme="dark"] .dk-card .arco-tag.dk-card__status-tag--online {
      color: rgb(var(--success-7, 128, 210, 182));
    }

    .dk-card .arco-tag.dk-card__status-tag--draft {
      background: var(--bg-color-component, #e8e8e8);
      color: var(--color-text-1, #1a1a1a);
    }

    .dk-card .arco-tag.dk-card__status-tag--offline {
      background: var(--color-danger-light, #fbe9ea);
      color: var(--color-danger, #c64751);
    }

    .dk-card__metadata {
      gap: var(--spacing-6, 16px);
      min-width: 0;
      color: var(--color-text-2, #666666);
      font-size: var(--fs-12, 12px);
      line-height: var(--lh-20, 20px);
    }

    .dk-card__meta-pair {
      gap: var(--spacing-4, 8px);
      min-width: 0;
    }

    .dk-card__meta-label {
      flex: 0 0 auto;
      color: var(--color-text-2, #666666);
    }

    .dk-card__meta-value {
      overflow: hidden;
      color: var(--color-text-1, #1a1a1a);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dk-card__selection {
      position: absolute;
      top: var(--spacing-5, 12px);
      right: var(--spacing-5, 12px);
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .dk-card:hover .dk-card__selection,
    .dk-card:focus-within .dk-card__selection,
    .dk-card[data-selected="true"] .dk-card__selection {
      opacity: 1;
    }

    .dk-card__footer {
      justify-content: space-between;
      gap: var(--spacing-4, 8px);
      height: 40px;
      padding: var(--spacing-4, 8px) var(--spacing-5, 12px);
      background: var(--bg-color-secondarycontainer, #f3f3f3);
      transition: background-color 160ms ease;
    }

    .dk-card[data-selected="true"] .dk-card__footer {
      background: var(--color-primary, #00754a);
    }

      function App() {
        const [products, setProducts] = useState(initialProducts);
        const [selectedIds, setSelectedIds] = useState(() => new Set(['product-1', 'product-2', 'product-3']));
        const [quickFilterValues, setQuickFilterValues] = useState({});
        const [isRefreshing, setIsRefreshing] = useState(false);
        const [copiedCodeId, setCopiedCodeId] = useState(null);

        const visibleProducts = useMemo(() => {
          const keyword = String(quickFilterValues.keyword || '').trim().toLowerCase();
          const status = quickFilterValues.status;
          return products.filter((product) => {
            const matchesStatus = !status || product.status === status;
            const matchesKeyword = !keyword || [product.name, product.code].some((value) => value.toLowerCase().includes(keyword));
            return matchesStatus && matchesKeyword;
          });
        }, [products, quickFilterValues]);

        const selectedVisibleCount = visibleProducts.reduce(
          (count, product) => count + (selectedIds.has(product.id) ? 1 : 0),
          0,
        );
        const allVisibleSelected = visibleProducts.length > 0 && selectedVisibleCount === visibleProducts.length;
        const someVisibleSelected = selectedVisibleCount > 0 && !allVisibleSelected;
        const selectionSummary = allVisibleSelected
          ? `已全选（${visibleProducts.length}）`
          : `已选${selectedIds.size}项`;

        const updateSelectedIds = (updater) => {
          setSelectedIds((current) => {
            const next = new Set(current);
            updater(next);
            return next;
          });
        };

        const toggleSelection = (productId) => {
          updateSelectedIds((next) => {
            if (next.has(productId)) next.delete(productId);
            else next.add(productId);
          });
        };

        const toggleSelectAllVisible = (checked) => {
          updateSelectedIds((next) => {
            visibleProducts.forEach((product) => {
              if (checked) next.add(product.id);
              else next.delete(product.id);
            });
          });
        };

        const removeProducts = (productIds) => {
          setProducts((current) => current.filter((product) => !productIds.has(product.id)));
          setSelectedIds((current) => new Set([...current].filter((id) => !productIds.has(id))));
        };

        const confirmDelete = (productIds, title, content) => {
          Modal.confirm({
            title,
            content,
            okText: '删除',
            cancelText: '取消',
            onOk: () => removeProducts(productIds),
          });
        };

        const copyProductCode = async (product) => {
          try {
            if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(product.code);
            } else {
              const textarea = document.createElement('textarea');
              textarea.value = product.code;
              textarea.style.position = 'fixed';
              textarea.style.opacity = '0';
              document.body.appendChild(textarea);
              textarea.select();
              const copied = document.execCommand('copy');
              textarea.remove();
              if (!copied) throw new Error('copy failed');
            }
            setCopiedCodeId(product.id);
            Message.success(`编码 ${product.code} 已复制`);
            window.setTimeout(() => {
              setCopiedCodeId((current) => current === product.id ? null : current);
            }, 1600);
          } catch {
            Message.error('复制失败，请手动复制编码');
          }
        };

        const handleCardAction = (actionKey, product) => {
          if (actionKey === 'promote') {
            setProducts((current) => [product, ...current.filter((item) => item.id !== product.id)]);
            Message.success(`已将「${product.name}」排到首位`);
            return;
          }
          if (actionKey === 'delete') {
            confirmDelete(new Set([product.id]), '确认删除卡片', `确认删除「${product.name}」？此操作只影响本地 Mock 数据。`);
            return;
          }
          if (actionKey === 'copy') {
            copyProductCode(product);
            return;
          }
          if (actionKey === 'publish' || actionKey === 'unpublish') {
            const nextStatus = actionKey === 'publish' ? 'online' : 'offline';
            setProducts((current) => current.map((item) => item.id === product.id ? { ...item, status: nextStatus } : item));
            Message.success(`已${actionKey === 'publish' ? '上架' : '下架'}「${product.name}」`);
            return;
          }
          Message.info(`已触发「${product.name}」的${cardActionConfig[actionKey].label}操作`);
        };

        const handleBatchAction = (actionKey) => {
          if (!selectedIds.size) return;
          if (actionKey === 'publish') {
            setProducts((current) => current.map((product) => selectedIds.has(product.id) ? { ...product, status: 'online' } : product));
            Message.success(`已上架 ${selectedIds.size} 项本地 Mock 数据`);
            return;
          }
          if (actionKey === 'delete') {
            confirmDelete(new Set(selectedIds), '确认批量删除', `确认删除选中的 ${selectedIds.size} 项？此操作只影响本地 Mock 数据。`);
            return;
          }
          Message.info(`已触发 ${selectedIds.size} 项的移动操作`);
        };

        const refreshData = () => {
          if (isRefreshing) return;
          setIsRefreshing(true);
          window.setTimeout(() => {
            setIsRefreshing(false);
            Message.success('本地 Mock 数据已刷新');
          }, 450);
        };

        const renderCardActions = (product, isSelected) => {
          const actions = product.actions.map((key) => cardActionConfig[key]);
          const visibleActions = actions.length <= 3 ? actions : actions.slice(0, 2);
          const overflowActions = actions.length <= 3 ? [] : actions.slice(2);
          const selectedActionStyle = isSelected ? { color: 'var(--dk-selected-action-color)' } : undefined;

          const renderActionButton = (action) => (
            <Button
              type={isSelected ? 'text' : 'secondary'}
              size="mini"
              style={selectedActionStyle}
              onClick={action.key === 'delete' ? undefined : () => handleCardAction(action.key, product)}
            >
              {action.label}
            </Button>
          );

          return (
            <div className="dk-card__actions" aria-label={`${product.name} 卡片操作`}>
              {visibleActions.map((action) => action.key === 'delete' ? (
                <Popconfirm
                  key={action.key}
                  position="bl"
                  title="确认删除卡片"
                  content={`确认删除「${product.name}」？此操作只影响本地 Mock 数据。`}
                  okText="删除"
                  cancelText="取消"
                  onOk={() => removeProducts(new Set([product.id]))}
                >
                  {renderActionButton(action)}
                </Popconfirm>
              ) : (
                <React.Fragment key={action.key}>{renderActionButton(action)}</React.Fragment>
              ))}
              {overflowActions.length > 0 && (
                <Dropdown
                  trigger="click"
                  position="bl"
                  droplist={(
                    <Menu onClickMenuItem={(key) => handleCardAction(String(key), product)}>
                      {overflowActions.map((action) => (
                        <Menu.Item key={action.key}>
                          <span>{action.label}</span>
                        </Menu.Item>
                      ))}
                    </Menu>
                  )}
                >
                  <Button
                    type={isSelected ? 'text' : 'secondary'}
                    size="mini"
                    style={selectedActionStyle}
                    aria-label={`${product.name} 更多操作`}
                    icon={<IconMore />}
                  />
                </Dropdown>
              )}
            </div>
          );
        };

        return (
          <div className="dk-demo-shell">
            <main className="dk-page">
              <section className="dk-page__section" aria-label="多选卡片管理列表">
                <div className="dk-card-toolbar-row">
                  <Checkbox
                    className="dk-card-toolbar__select-all"
                    checked={allVisibleSelected}
                    indeterminate={someVisibleSelected}
                    disabled={!visibleProducts.length}
                    aria-label={allVisibleSelected ? '取消全选当前筛选结果' : '全选当前筛选结果'}
                    onChange={toggleSelectAllVisible}
                  >
                    {selectionSummary}
                  </Checkbox>
                  <span className="dk-card-toolbar__divider" aria-hidden="true" />
                  <TableToolbar
                    className="dk-card-toolbar"
                    style={{ paddingBlock: 0 }}
                    ariaLabel="卡片列表工具栏"
                    quickFilters={quickFilters}
                    quickFilterValues={quickFilterValues}
                    selectedCount={selectedIds.size}
                    operationActions={batchActions}
                    tableTools={{
                      export: { tooltip: '导出', ariaLabel: '导出当前卡片列表' },
                      refresh: { loading: isRefreshing, tooltip: '刷新', ariaLabel: '刷新卡片列表' },
                    }}
                    onQuickFilterChange={setQuickFilterValues}
                    onOperation={handleBatchAction}
                    onExport={() => Message.success(`已模拟导出 ${visibleProducts.length} 项卡片数据`)}
                    onRefresh={refreshData}
                  />
                </div>

                {visibleProducts.length ? (
                  <div className="dk-card-grid">
                    {visibleProducts.map((product) => {
                      const isSelected = selectedIds.has(product.id);
                      const status = statusMeta[product.status];
                      return (
                        <article
                          key={product.id}
                          className="dk-card"
                          data-selected={isSelected ? 'true' : 'false'}
                          aria-label={`${product.name}${isSelected ? '，已选中' : ''}`}
                        >
                          <div className="dk-card__content">
                            <div className="dk-card__selection">
                              <Checkbox
                                checked={isSelected}
                                aria-label={`${isSelected ? '取消选择' : '选择'}${product.name}`}
                                onChange={() => toggleSelection(product.id)}
                              />
                            </div>
                            <div className="dk-card__media">
                              <img src={restoredProductImagePng} alt={`${product.name}示例图`} />
                            </div>
                            <div className="dk-card__primary">
                              <div className="dk-card__heading">
                                <h2 className="dk-card__title" title={product.name}>{product.name}</h2>
                                <div className="dk-card__summary">
                                  <span className="dk-card__price">￥{product.price}</span>
                                  <Tag
                                    className={`dk-card__status-tag dk-card__status-tag--${product.status}`}
                                    color={status.color}
                                  >{status.label}</Tag>
                                </div>
                              </div>
                              <div className="dk-card__metadata">
                                <span className="dk-card__meta-pair">
                                  <span className="dk-card__meta-label">编码</span>
                                  <button
                                    className="dk-card__copy-button"
                                    type="button"
                                    aria-label={`复制编码 ${product.code}`}
                                    onClick={() => copyProductCode(product)}
                                  >
                                    <span className="dk-card__meta-value">{product.code}</span>
                                    {copiedCodeId === product.id ? (
                                      <span className="dk-card__copy-feedback" role="status">已复制</span>
                                    ) : (
                                      <img className="dk-card__copy-indicator" src={copyIcon} alt="" />
                                    )}
                                  </button>
                                </span>
                                <span className="dk-card__meta-pair">
                                  <span className="dk-card__meta-label">类型</span>
                                  <span className="dk-card__meta-value">{product.type}</span>
                                </span>
                              </div>
                            </div>
                          </div>
                          <footer className="dk-card__footer">
                            <span className="dk-card__sequence">
                              <span className="dk-card__sequence-label">序号</span>
                              <span className="dk-card__sequence-value">{product.sequence}</span>
                            </span>
                            {renderCardActions(product, isSelected)}
                          </footer>
                        </article>
                      );
                    })}
                  </div>
                ) : (
                  <div className="dk-empty">
                    <Empty description="没有匹配的卡片，请调整筛选条件。" />
                  </div>
                )}
              </section>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
  </script>
</body>
</html>
