# scripts/figma-to-arco/arco-theme-mapping.example.yml

# ── 全局映射：Figma collection 名称 → Arco token 前缀 ──
# 当 tokens 精确映射未命中时，使用此规则自动生成 Arco 名称
collections:
  "Brand Colors":       "color"
  "Text Colors":        "color-text"
  "Background Colors":  "color-bg"
  "Border Colors":      "color-border"
  "Typography":         "font"
  "Spacing":            "spacing"
  "Radius":             "radius"
  "Shadow":             "shadow"
  "Styles":             "color"

# ── 精确映射：Figma 全路径 → Arco token 名称 ──
# 优先级高于 collections fallback
tokens:
  # 品牌色 → Arco primary 色阶（根据实际 Figma 名称填写）
  # "Brand Colors/brand/primary/500": "primary-5"
  # "Brand Colors/brand/primary/600": "primary-6"
  # 文本色 → Arco 语义色
  # "Text Colors/text/primary": "color-text-1"
  # "Text Colors/text/secondary": "color-text-2"
  # "Text Colors/text/disabled": "color-text-3"
  # 组件级 token
  # "Button/button/padding-horizontal": "btn-padding-horizontal"
  # "Input/input/border-radius": "input-border-radius"

# ── 值转换选项 ──
transforms:
  rgba_to_hex: true
  px_to_rem: false
  opacity_to_alpha: true

# ── Figma mode 名称 → Arco 主题标识 ──
modes:
  "Light Theme": "light"
  "Dark Theme": "dark"

# ── 输出配置 ──
output:
  packageName: "arco-theme-starbucks"
  dir: "./arco-theme-output"
